      <stop offset="0.72" stop-color="#312e81" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#c7d2fe" stop-opacity="0.46"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
